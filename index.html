<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slide Decks — Home</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #171a23;
    --surface-hover: #1e2230;
    --border: #2a2f3e;
    --text: #e8eaf0;
    --text-muted: #9aa3b5;
    --accent: #6c8cff;
    --accent-soft: rgba(108, 140, 255, 0.12);
    --radius: 16px;
    --shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
    --transition: 220ms ease;
  }

  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f5f6fa;
      --surface: #ffffff;
      --surface-hover: #ffffff;
      --border: #e3e6ef;
      --text: #1a1d27;
      --text-muted: #5c6474;
      --accent: #4a6cf7;
      --accent-soft: rgba(74, 108, 247, 0.08);
      --shadow: 0 8px 30px rgba(20, 30, 60, 0.10);
    }
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                 "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Header ---------- */
  .site-header {
    padding: 3rem 1.5rem 1.5rem;
    text-align: center;
  }

  .site-header .eyebrow {
    display: inline-block;
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    background: var(--accent-soft);
    padding: 0.35rem 0.9rem;
    border-radius: 999px;
    margin-bottom: 1rem;
  }

  .site-header h1 {
    font-size: clamp(1.7rem, 4vw, 2.6rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.15;
  }

  .site-header p {
    margin: 0.75rem auto 0;
    max-width: 42rem;
    color: var(--text-muted);
    font-size: clamp(0.95rem, 2vw, 1.05rem);
    line-height: 1.55;
  }

  /* ---------- Deck grid ---------- */
  .decks {
    flex: 1;
    width: min(1200px, 100% - 3rem);
    margin: 1.5rem auto 0;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1.5rem;
    align-items: stretch;
    padding-bottom: 3rem;
  }

  /* ---------- Deck card ---------- */
  .deck {
    display: flex;
    flex-direction: column;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    text-decoration: none;
    color: inherit;
    box-shadow: var(--shadow);
    transition: transform var(--transition), box-shadow var(--transition),
                border-color var(--transition), background var(--transition);
  }

  .deck:hover,
  .deck:focus-visible {
    transform: translateY(-6px);
    border-color: var(--accent);
    background: var(--surface-hover);
    box-shadow: 0 14px 40px rgba(0, 0, 0, 0.30);
  }

  .deck:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }

  .deck .thumb {
    aspect-ratio: 16 / 9;
    background: linear-gradient(135deg, var(--accent-soft), var(--surface-hover));
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* Preview image — falls back to a numbered badge if image missing */
  .deck .thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .deck .thumb .fallback {
    font-size: 2.6rem;
    font-weight: 800;
    color: var(--accent);
    opacity: 0.85;
    user-select: none;
  }

  .deck .body {
    padding: 1.35rem 1.4rem 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    flex: 1;
  }

  .deck h2 {
    font-size: 1.2rem;
    font-weight: 650;
    letter-spacing: -0.01em;
  }

  .deck p {
    color: var(--text-muted);
    font-size: 0.92rem;
    line-height: 1.55;
    flex: 1;
  }

  .deck .meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 0.75rem;
    font-size: 0.82rem;
    color: var(--text-muted);
  }

  .deck .open {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    font-weight: 600;
    color: var(--accent);
  }

  .deck .arrow {
    transition: transform var(--transition);
  }

  .deck:hover .arrow {
    transform: translateX(4px);
  }

  /* ---------- Footer ---------- */
  .site-footer {
    text-align: center;
    padding: 1.5rem;
    color: var(--text-muted);
    font-size: 0.82rem;
    border-top: 1px solid var(--border);
  }

  /* ---------- Responsive ---------- */
  @media (max-width: 960px) {
    .decks { grid-template-columns: repeat(2, 1fr); }
  }

  @media (max-width: 620px) {
    .decks {
      grid-template-columns: 1fr;
      width: min(100%, 100% - 2rem);
      gap: 1.25rem;
    }
    .site-header { padding-top: 2.25rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
    html { scroll-behavior: auto; }
  }
</style>
</head>
<body>

<header class="site-header">
  <span class="eyebrow">OCIA Classes</span>
  <h1>OCIA Classes</h1>
  <p></p>
</header>

<main class="decks">

  <!-- Deck 1 — edit href, title, description, and preview image -->
  <a class="deck" href="./moses/index.html">
    <div class="thumb">
      <img src="./moses/moses-slide1-red-sea.png" alt="">
    </div>
    <div class="body">
      <h2>Moses</h2>
      <p></p>
      <div class="meta">
        <span>./deck-1/</span>
        <span class="open">Open <span class="arrow">&rarr;</span></span>
      </div>
    </div>
  </a>

  <!-- Deck 2 -->
  <a class="deck" href="./eucharist/index.html">
    <div class="thumb">
      <img src="./eucharist/01.png" alt="">
    </div>
    <div class="body">
      <h2>The Eucharist</h2>
      <p></p>
      <div class="meta">
        <span>./deck-2/</span>
        <span class="open">Open <span class="arrow">&rarr;</span></span>
      </div>
    </div>
  </a>

  <!-- Deck 3 -->
  <a class="deck" href="./incarnation/index.html">
    <div class="thumb">
      <img src="./incarnation/01.png" alt="">
    </div>
    <div class="body">
      <h2>Incarnation</h2>
      <p></p>
      <div class="meta">
        <span>./deck-3/</span>
        <span class="open">Open <span class="arrow">&rarr;</span></span>
      </div>
    </div>
  </a>

</main>

<footer class="site-footer">
  Navigate with the cards above &middot; Use arrow keys inside each deck if supported
</footer>

</body>
</html>
